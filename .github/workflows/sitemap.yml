name: Generate sitemap.xml

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/sitemap.xml'
      - 'sitemap.xml'

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar sitemap.xml
        env:
          SITEMAP_BASE_URL: "https://www.neofisioterapia.com.br"
        run: node scripts/generate-sitemap.mjs

      # Lista completa (LPs inclusive) para o menu Clientes do Link HUB.
      # Token com escopo unico linkhub.paginas:write; sem o secret, so pula.
      - name: Enviar paginas ao Link HUB
        env:
          SITEMAP_BASE_URL: "https://www.neofisioterapia.com.br"
          LINKHUB_TOKEN: ${{ secrets.LINKHUB_PAGINAS_TOKEN }}
          LINKHUB_AGENCIA: hound
          LINKHUB_SLUG: neo-fisioterapia
        run: node scripts/enviar-paginas.mjs

      - name: Commitar sitemap.xml se mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain -- '*sitemap.xml')" ]; then
            git config user.name "sitemap-bot"
            git config user.email "sitemap-bot@users.noreply.github.com"
            git add -- '*sitemap.xml'
            git commit -m "chore: atualiza sitemap.xml automaticamente"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${GITHUB_REF_NAME}"
          else
            echo "sitemap.xml sem mudanças"
          fi
